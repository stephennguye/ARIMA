# ARIMA work-package register. The source of truth for "what is next". Checked by
# plugins/arima/scripts/test/build-docs.test.ts (unique ids, known dependencies, no cycles, a package never
# depends on a later stage, `ready` packages have all dependencies `done`, spec references exist).
#
# status: done | ready | planned | owner   (owner = waits for an owner decision, listed in `owner_input`)
# stage:  0..5 (see 02-stages.md).  track: engine | contracts | agent | skill | safety | eval | docs | owner
# spec:   section numbers of docs/spec/ARIMA-Master-Spec.md that the package implements.
schema_version: 1
packages:
