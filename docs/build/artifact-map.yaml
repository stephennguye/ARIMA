# Every artifact of the catalog (58) mapped to the work packages that produce or validate it, with its owner,
# approver, master location and how a wrong output is detected. Checked by build-docs.test.ts: all 58 ids present,
# every referenced package exists, every non-external artifact has at least one package.
# This is the "nothing is forgotten" list: a team leaves an artifact trail, so each one needs a builder.
schema_version: 1
artifacts:
