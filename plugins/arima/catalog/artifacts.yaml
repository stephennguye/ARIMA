# ARIMA artifact catalog (spec section 8.1), 58 artifacts. Source of truth for ids, owners, master locations,
# which profiles require each artifact, its template and the template's required sections. It was generated
# once from the spec and is edited by hand now. Section lists for artifacts the spec does not define in 8.2
# follow the wording of the spec's phase tables (6.x) and role outputs (5.x) and were approved by the owner on 2026-11-19.
schema_version: 1
artifacts:
  - id: project-brief
    name: Project brief
    phase: "0"
    owner: po (human)
    approver: orchestrator checks completeness
    master: Notion page
    consumers: ba, architect
    required_in: S C R
    required:
      solo_lite: true
      client_project: true
      regulated: true
    kind: document
    template: project-brief.md
    sections:
      - Problem
      - Target users
      - Goals and KPIs
      - Must-have features
      - Out of scope
      - Constraints
      - Known risks
  - id: charter
    name: Charter
    phase: "0"
    owner: orchestrator
    approver: sponsor (G0)
    master: Notion page
    consumers: all
    required_in: C R
    required:
      solo_lite: false
      client_project: true
      regulated: true
    kind: document
    template: charter.md
    sections:
      - Scope
      - Rough milestones
      - Budget plan
      - Risks
      - Roles and responsibilities
  - id: budget-plan
