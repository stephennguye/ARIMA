name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval
      - run: npm run build
      - name: dist/ matches a fresh build
        run: npm run check:dist
      - name: Install Claude Code (pinned) for plugin validation
        run: npm install -g @anthropic-ai/claude-code@2.1.327
      - name: Validate the plugin (strict)
        run: claude plugin validate ./plugins/arima --strict
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the plugin inside a throwaway marketplace
        shell: bash
        run: |
          d="$(mktemp -d)"
          mkdir -p "$d/.claude-plugin" "$d/plugins"
          cp -r plugins/arima "$d/plugins/arima"
          cp .claude-plugin/marketplace.json "$d/.claude-plugin/marketplace.json"
          claude plugin validate "$d" --json
